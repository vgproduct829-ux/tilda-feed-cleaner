name: Clean Feed
on:
  schedule:
    - cron: "0 * * * *"   # каждый час
  workflow_dispatch:      # плюс кнопка ручного запуска

jobs:
  clean:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python clean_feed.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add feed.yml
          git commit -m "update feed" || echo "no changes"
          git push
